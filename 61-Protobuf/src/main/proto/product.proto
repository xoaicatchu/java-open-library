syntax = "proto3";

package com.example.protobuf;

option java_package = "com.example.protobuf.model";
option java_outer_classname = "ProductOuterClass";

import "google/protobuf/timestamp.proto";

message Category {
    int32 id = 1;
    string name = 2;
}

message Product {
    string id = 1;
    string name = 2;
    double price = 3;
    Category category = 4;
    repeated string tags = 5;
    google.protobuf.Timestamp created_at = 6;
    
    // Demonstrate oneof field
    oneof status {
        string active_status = 7;
        string discontinued_reason = 8;
    }
}
