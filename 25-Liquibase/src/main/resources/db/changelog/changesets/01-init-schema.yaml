databaseChangeLog:
  - changeSet:
      id: 01-create-departments
      author: dev
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: departments
      changes:
        - createTable:
            tableName: departments
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: departments
  - changeSet:
      id: 01-create-employees
      author: dev
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: employees
      changes:
        - createTable:
            tableName: employees
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: first_name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: department_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_employee_department
                    references: departments(id)
      rollback:
        - dropTable:
            tableName: employees
