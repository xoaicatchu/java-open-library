server:
  port: 8107

spring:
  application:
    name: axon-framework-demo
  datasource:
    url: jdbc:h2:mem:axondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  threads:
    virtual:
      enabled: true

axon:
  axonserver:
    enabled: false # Use in-memory event store instead of Axon Server for standalone
  serializer:
    general: jackson
    messages: jackson
    events: jackson
