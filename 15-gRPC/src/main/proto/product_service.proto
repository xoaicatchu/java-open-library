syntax = "proto3";

package com.example.grpc;

option java_multiple_files = true;
option java_package = "com.example.grpc.proto";
option java_outer_classname = "ProductProto";

service ProductService {
    // 1. Unary RPC
    rpc GetProduct(GetProductRequest) returns (ProductResponse);
    rpc CreateProduct(CreateProductRequest) returns (ProductResponse);

    // 2. Server Streaming
    rpc ListProducts(ListProductsRequest) returns (stream ProductResponse);

    // 3. Client Streaming
    rpc BulkCreateProducts(stream CreateProductRequest) returns (BulkCreateResponse);

    // 4. Bidirectional Streaming
    rpc PriceNegotiation(stream PriceRequest) returns (stream PriceResponse);
}

message ProductResponse {
    string id = 1;
    string name = 2;
    double price = 3;
}

message GetProductRequest {
    string id = 1;
}

message CreateProductRequest {
    string name = 1;
    double price = 2;
}

message ListProductsRequest {
    int32 max_results = 1;
}

message BulkCreateResponse {
    int32 count = 1;
}

message PriceRequest {
    string product_id = 1;
    double suggested_price = 2;
}

message PriceResponse {
    string product_id = 1;
    double final_price = 2;
    bool accepted = 3;
}
