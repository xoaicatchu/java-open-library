server:
  port: 8101

spring:
  application:
    name: spring-webmvc-demo
  threads:
    virtual:
      enabled: true  # JDK 21 Virtual Threads

  datasource:
    url: jdbc:h2:mem:webmvc_db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console
