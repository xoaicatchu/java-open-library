server:
  port: 8108

spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:eventdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
