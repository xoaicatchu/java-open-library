server:
  port: 8158
spring:
  application:
    name: 58-OpenPDF
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:openpdfdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
